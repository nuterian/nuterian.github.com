# The gates. check.mjs was the only one that ran here, which left the three that
# guard the flock's own behaviour — how it flies, whether it jams, and whether it
# works in a browser that is not Chromium — running only when someone remembered.
# Those protect the least screenshot-visible things on the site, and DESIGN.md is
# largely a catalogue of them regressing. Three jobs rather than one so a slow
# WebKit/Firefox download never delays the answer from the fast ones.
name: check
on:
  push:
  pull_request:

jobs:
  # axe, Lighthouse, the budget, reduced motion, no-JS, the pinned behaviours, offline.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools
      - name: Serve (gzip + cache headers, like GitHub Pages)
        run: (node serve.mjs 4174 &) && sleep 1
        working-directory: tools
      - name: axe · Lighthouse · budget · motion · no-js · behaviours · offline
        run: node check.mjs http://localhost:4174
        working-directory: tools
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: tools/out

  # Does it still fly like a bird, and does it still not pile up in corners?
  # Neither is visible in a screenshot, which is exactly why they are gated.
  flock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools
      - name: Serve
        run: (node serve.mjs 4174 &) && sleep 1
        working-directory: tools
      - name: flight · turn rate, one span, the beat, frame pacing
        run: node flight.mjs http://localhost:4174
        working-directory: tools
      - name: crowd · jams, standing lines, edge bands
        run: node crowd.mjs
        working-directory: tools
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: flock
          path: tools/out

  # The same site in WebKit and Firefox. Its own job: these two take far longer
  # to install than they do to run, and nothing else should wait on that.
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npx playwright install --with-deps webkit firefox
        working-directory: tools
      - name: Serve
        run: (node serve.mjs 4174 &) && sleep 1
        working-directory: tools
      - name: WebKit and Firefox
        working-directory: tools
        # This job is flaky on the runner in more than one way, and none of them
        # have been the site: WebKit has died mid-run ("Target page, context or
        # browser has been closed") and a click on an archive row has timed out
        # after resolving and scrolling to it. Both went green on a re-run of the
        # very same commit, one of them on a push that changed no site code at all.
        #
        # So the rule is not a list of crash strings — the first version was, and
        # the second flake walked straight past it. It is the distinction that
        # actually matters: engines.mjs prints ✗ when it has a FINDING about the
        # site. A run that reported one is never retried, however it ended. A run
        # that fell over without reporting anything gets one more go, because that
        # is the environment failing, not the page. If it falls over twice, the
        # job fails — and if the site is genuinely broken, the ✗ arrives on the
        # first run and stops there.
        run: |
          set +e
          out=$(node engines.mjs http://localhost:4174 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          if echo "$out" | grep -q '✗'; then
            echo "::error::engines reported a finding — not retrying."
            exit $code
          fi
          echo "::warning::engines fell over without reporting a finding. Retrying once."
          node engines.mjs http://localhost:4174
