name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools
      - name: Serve (gzip + cache headers, like GitHub Pages)
        run: (node serve.mjs 4174 &) && sleep 1
        working-directory: tools
      - name: axe · Lighthouse · budget · motion · no-js
        run: node check.mjs http://localhost:4174
        working-directory: tools
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: tools/out
